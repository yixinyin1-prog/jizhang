<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b8f66">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="生活记账">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">
<title>生活记账</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <span class="logo"><span class="logo-mark">¥</span>生活记账</span>
    <span id="storageHint" class="storage-hint"></span>
  </div>
  <nav class="tabbar">
    <button class="tab active" data-tab="record"><span class="tab-icon">✏️</span><span>记账</span></button>
    <button class="tab" data-tab="detail"><span class="tab-icon">📋</span><span>明细</span></button>
    <button class="tab" data-tab="stats"><span class="tab-icon">📊</span><span>统计</span></button>
    <button class="tab" data-tab="compare"><span class="tab-icon">📈</span><span>对比</span></button>
    <button class="tab" data-tab="category"><span class="tab-icon">🏷️</span><span>分类</span></button>
    <button class="tab" data-tab="data"><span class="tab-icon">💾</span><span>数据</span></button>
  </nav>
</header>

<div id="remindHost" class="view" style="padding-bottom:0"></div>
<main id="view" class="view"></main>

<div id="toast" class="toast"></div>

<script src="js/store.js"></script>
<script src="js/theme.js"></script>
<script src="js/modal.js"></script>
<script src="js/parser.js"></script>
<script src="js/charts.js"></script>
<script src="js/xlsx.js"></script>
<script src="js/backup.js"></script>
<script src="js/app.js"></script>
<script>
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
</body>
</html>
